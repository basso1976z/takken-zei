<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="宅建 税">
<meta name="theme-color" content="#1f3a5f">
<title>宅建 税の一問一答</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2430;--sub:#6b7480;--line:#e2e5ea;--pri:#1f3a5f;--ok:#1a8a5a;--ng:#d23c3c;--warn:#c98a00;--hl:#ffe36e;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1c222b;--ink:#e7eaee;--sub:#9aa3ae;--line:#2c3440;--pri:#7fb0ff;--ok:#3fcf8e;--ng:#ff6b6b;--warn:#f0b429;--hl:#6b5a00;--chip:#252c37}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:16px;margin:20px 0 8px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:12px 14px;background:var(--chip);color:var(--ink)}
button.pri{background:var(--pri);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){button.pri{color:#0d1520}}
button.block{display:block;width:100%;margin:8px 0;text-align:left}
button.block small{display:block;opacity:.75;font-size:12px;font-weight:400}
button:disabled{opacity:.4}
.count b{font-size:34px;color:var(--ng);line-height:1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
.stats3 div{background:var(--chip);border-radius:10px;padding:8px 4px}.stats3 b{display:block;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:999px;font-size:14px}
.chip.on{background:var(--pri);color:#fff}@media (prefers-color-scheme:dark){.chip.on{color:#0d1520}}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--sub);margin-right:4px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--pri)}
.qtext{font-size:18px;line-height:1.7;margin-top:8px}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:3px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 20%)}
.ans button{font-size:44px;font-weight:700;padding:22px 0;background:var(--card);border:2px solid var(--line);line-height:1}
.ans button.pri{background:var(--pri);border-color:var(--pri);padding:18px 0;font-size:18px;grid-column:1/3}
.ans .o{color:var(--ok)}.ans .x{color:var(--ng)}
.quiz{padding-bottom:150px}
.verdict{font-size:20px;font-weight:700}.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.exp{border-left:4px solid var(--pri);padding:4px 0 4px 12px;margin:10px 0}
.toggle{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--chip);margin:8px 0}
.toggle input{width:20px;height:20px}
.mini{display:grid;grid-template-columns:8.5em 1fr 3.5em;gap:8px;align-items:center;font-size:14px;margin:6px 0}.mini .bar{margin:0}
.mini .bar i.low{background:var(--ng)}.mini .bar i.mid{background:var(--warn)}.mini .bar i.hi{background:var(--ok)}
.list .it{border-top:1px solid var(--line);padding:10px 0;font-size:14px}.list .it:first-child{border-top:none}
.mk{font-weight:700;margin-right:6px}.mk.ok{color:var(--ok)}.mk.ng{color:var(--ng)}
.top{display:flex;align-items:center;gap:8px}.top button{padding:8px 12px;font-size:14px}.grow{flex:1}
a{color:var(--pri)}.foot{color:var(--sub);font-size:12px;margin-top:24px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;border:2px solid var(--line);background:var(--card);font-size:15px;line-height:1.6}
.opt.right{border-color:var(--ok)}.opt.bad{border-color:var(--ng)}
.opt .why{display:block;font-size:13px;color:var(--sub);margin-top:4px}
.opt .why::before{content:"";}
.ptbl{width:100%;border-collapse:collapse;font-size:13px}
.ptbl th,.ptbl td{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.ptbl th{background:var(--chip);white-space:nowrap}
.scroll{overflow-x:auto}
.flow{border-left:3px solid var(--pri);margin-left:8px;padding-left:14px}
.flow div{margin:0 0 12px;position:relative}.flow div::before{content:"";position:absolute;left:-21px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.flow b{display:block;font-size:14px}.flow span{font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script>
(() => {
const SEC = window.SEC, OX = window.OX, MC = window.MC, P = window.POINTS;
const EXAM = new Date(2026, 9, 18);
const KEY = "takken-zei-v1";
const app = document.getElementById("app");
OX.forEach(q => q.kind = "ox"); MC.forEach(q => q.kind = "mc");
const ALL = [...OX, ...MC], byId = Object.fromEntries(ALL.map(q => [q.id, q]));
let store = {rec:{}, secs:Object.keys(SEC)};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.rec) store = Object.assign(store, s); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} };
const rec = id => store.rec[id];
const isWeak = q => { const r = rec(q.id); return !!r && (r.last === 0 || r.u === 1); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (c, n) => n ? Math.round(c / n * 100) : null;
const sortWeak = list => list.map(q => { const r = rec(q.id); return [r ? (isWeak(q) ? 1.5 : 0) + (1 - r.c / r.n) + Math.random() : 2 + Math.random(), q]; }).sort((a, b) => b[0] - a[0]).map(x => x[1]);

let S = null;
function start(list, label) { if (!list.length) return alert("該当する問題がありません"); S = {list, i:0, results:[], answered:false, label}; renderQ(); }

function renderHome() {
  S = null; app.className = "wrap";
  const days = Math.ceil((EXAM - new Date(new Date().toDateString())) / 864e5);
  const st = list => { const a = list.filter(q => rec(q.id)); const n = a.reduce((s, q) => s + rec(q.id).n, 0), c = a.reduce((s, q) => s + rec(q.id).c, 0); return {done:a.length, p:pct(c, n)}; };
  const so = st(OX), sm = st(MC), weak = ALL.filter(isWeak);
  const pool = OX.filter(q => store.secs.includes(q.s));
  app.innerHTML = `
  <h1>宅建 税の一問一答</h1>
  <div class="sub">不動産取得税・固定資産税・登録免許税・印紙税・譲渡所得・贈与税</div>
  <div class="card"><div class="count">${days > 0 ? `本試験（10/18）まで <b>${days}</b> 日` : days === 0 ? "<b>本日</b> 本試験" : "試験お疲れさまでした"}</div>
    <div class="stats3">
      <div><b>${so.p ?? "-"}${so.p == null ? "" : "%"}</b><span class="sub">○× ${so.done}/${OX.length}</span></div>
      <div><b>${sm.p ?? "-"}${sm.p == null ? "" : "%"}</b><span class="sub">4択 ${sm.done}/${MC.length}</span></div>
      <div><b style="color:var(--ng)">${weak.length}</b><span class="sub">要復習</span></div></div></div>
  <button class="block" id="bPts">📋 まず要点を確認<small>税目の比較・床面積要件・数字・印紙税の記載金額</small></button>
  <button class="pri block" id="bOx">⭕ ○×一問一答 20問<small>苦手を優先して出題</small></button>
  <button class="pri block" id="bMc">📝 4択（本試験形式）${MC.length}問<small>正しいもの／誤っているものを選ぶ</small></button>
  <button class="block" id="bWeak" ${weak.length ? "" : "disabled"}>🔁 要復習だけ解く（${weak.length}問）<small>間違えた問題＋「迷った」問題</small></button>
  <h2>分野を選んで○×</h2>
  <div class="card"><div class="chips" id="rng">${Object.entries(SEC).map(([k, v]) => `<button class="chip ${store.secs.includes(k) ? "on" : ""}" data-k="${k}">${v}</button>`).join("")}</div>
    <button class="pri block" id="bCustom" style="text-align:center;margin-top:12px">この範囲でスタート（${pool.length}問）</button></div>
  <h2>分野別の正答率</h2><div class="card">${analysis()}</div>
  <div class="foot">2026年度試験（令和8年4月1日現在の法令）を前提。期限付きの特例は最新情報もご確認ください。学習記録はこの端末のブラウザに保存されます。<br><a href="#" id="bReset">学習記録をリセット</a></div>`;
  document.getElementById("bPts").onclick = renderPoints;
  document.getElementById("bOx").onclick = () => start(sortWeak(OX).slice(0, 20), "○×");
  document.getElementById("bMc").onclick = () => start(sortWeak(MC), "4択");
  document.getElementById("bWeak").onclick = () => start(shuffle(weak), "要復習");
  document.getElementById("rng").onclick = e => { const k = e.target.dataset.k; if (!k) return;
    store.secs = store.secs.includes(k) ? store.secs.filter(x => x !== k) : [...store.secs, k]; save(); renderHome(); };
  document.getElementById("bCustom").onclick = () => start(shuffle([...pool]), "分野別");
  document.getElementById("bReset").onclick = e => { e.preventDefault(); if (confirm("学習記録をすべて消去します。よろしいですか？")) { store.rec = {}; save(); renderHome(); } };
}

function analysis() {
  return Object.entries(SEC).map(([k, v]) => { const l = ALL.filter(q => q.s === k); let n = 0, c = 0;
    l.forEach(q => { const r = rec(q.id); if (r) { n += r.n; c += r.c; } }); const p = pct(c, n), cls = p == null ? "" : p < 60 ? "low" : p < 80 ? "mid" : "hi";
    return `<div class="mini"><span>${v}</span><div class="bar"><i class="${cls}" style="width:${p ?? 0}%"></i></div><span>${p == null ? "-" : p + "%"}</span></div>`; }).join("");
}

function renderQ() {
  const q = S.list[S.i], r = rec(q.id); S.answered = false;
  app.className = "wrap quiz";
  const head = `<div class="top"><button id="bQuit">✕ 中断</button><div class="grow sub" style="text-align:right">${S.label}　${S.i + 1} / ${S.list.length}</div></div><div class="bar"><i style="width:${S.i / S.list.length * 100}%"></i></div>`;
  const hist = r ? `<span class="tag">${r.c}/${r.n}正解</span>` : "";
  if (q.kind === "ox") {
    app.innerHTML = `${head}<div class="card"><span class="tag">${SEC[q.s]}</span>${hist}<div class="qtext" id="qt">${esc(q.q)}</div></div><div id="res"></div>
      <div class="ans" id="ans"><button class="o" data-a="1">○</button><button class="x" data-a="0">×</button></div>`;
    document.getElementById("ans").onclick = e => { const a = e.target.closest("button")?.dataset.a; if (a != null) answerOx(a === "1"); };
  } else {
    S.order = shuffle(q.o.map((_, i) => i));
    app.innerHTML = `${head}<div class="card"><span class="tag">${SEC[q.s]}</span>${hist}<div class="qtext">${esc(q.q)}</div></div><div id="opts">
      ${S.order.map((oi, n) => `<button class="opt" data-i="${oi}">${n + 1}　${esc(q.o[oi][0])}</button>`).join("")}</div><div id="res"></div>`;
    document.getElementById("opts").onclick = e => { const b = e.target.closest(".opt"); if (b && !S.answered) answerMc(+b.dataset.i); };
  }
  document.getElementById("bQuit").onclick = () => S.results.length ? renderResult() : renderHome();
  window.scrollTo(0, 0);
}

function record(q, ok) {
  const r = store.rec[q.id] = store.rec[q.id] || {n:0, c:0, last:null, u:0, streak:0};
  r.n++; if (ok) { r.c++; r.streak++; } else r.streak = 0;
  r.last = ok ? 1 : 0; if (!ok) r.u = 0; else if (r.u && r.streak >= 2) r.u = 0;
  save(); const res = {id:q.id, ok, u:false}; S.results.push(res); return [r, res];
}
function afterAnswer(ok, body, r, res, keepAns) {
  S.answered = true; const a = document.getElementById("ans"); if (a) a.remove();
  document.getElementById("res").innerHTML = `<div class="card"><div class="verdict ${ok ? "ok" : "ng"}">${ok ? "正解！" : "不正解…"}</div>${body}
    ${ok ? `<label class="toggle"><input type="checkbox" id="unsure"> 正解したけど迷った（要復習に入れる）</label>` : ""}</div>
    <div class="ans"><button class="pri" id="bNext">${S.i + 1 < S.list.length ? "次へ ▶" : "結果を見る"}</button></div>`;
  const u = document.getElementById("unsure");
  if (u) u.onchange = () => { r.u = u.checked ? 1 : 0; if (u.checked) r.streak = 0; res.u = u.checked; save(); };
  document.getElementById("bNext").onclick = () => { S.i++; S.i < S.list.length ? renderQ() : renderResult(); };
  window.scrollTo(0, document.body.scrollHeight);
}
function answerOx(choice) {
  if (S.answered) return; const q = S.list[S.i], ok = choice === q.a, [r, res] = record(q, ok);
  if (q.h && q.q.includes(q.h)) document.getElementById("qt").innerHTML = esc(q.q).replace(esc(q.h), `<mark>${esc(q.h)}</mark>`);
  afterAnswer(ok, `<div style="margin-top:4px">正答は <b>${q.a ? "○" : "×"}</b></div><div class="exp">${esc(q.e)}</div>`, r, res);
}
function answerMc(i) {
  const q = S.list[S.i], want = q.type === "correct" ? 1 : 0, ok = q.o[i][1] === want, [r, res] = record(q, ok);
  S.answered = true;
  document.querySelectorAll(".opt").forEach(b => { const o = q.o[+b.dataset.i], right = o[1] === want;
    b.classList.toggle("right", right); b.classList.toggle("bad", +b.dataset.i === i && !right);
    b.innerHTML += `<span class="why">${right && q.type === "wrong" ? "← 誤り：" : ""}${esc(o[2])}</span>`; });
  afterAnswer(ok, `<div class="sub" style="margin-top:4px">${q.type === "correct" ? "正しいものを選ぶ問題" : "誤っているものを選ぶ問題"}。各肢の解説は上の選択肢に表示しています。</div>`, r, res);
}

function renderResult() {
  const rs = S.results, okAll = rs.filter(x => x.ok).length;
  app.className = "wrap"; const miss = rs.filter(x => !x.ok || x.u).map(x => byId[x.id]);
  app.innerHTML = `<h1>結果</h1><div class="card"><div class="count"><b style="color:var(--pri)">${okAll}</b> / ${rs.length} 問正解（${pct(okAll, rs.length)}%）</div>
    <div class="sub">うち迷った問題 ${rs.filter(x => x.ok && x.u).length} 問</div></div>
  ${miss.length ? `<button class="pri block" id="bRetry" style="text-align:center">間違い・迷った ${miss.length} 問をもう一度</button>` : ""}
  <button class="block" id="bHome" style="text-align:center">ホームへ</button>
  <div class="card list">${rs.map(x => { const q = byId[x.id]; const mk = `<span class="mk ${x.ok ? "ok" : "ng"}">${x.ok ? (x.u ? "△" : "○") : "×"}</span>`;
    return q.kind === "ox" ? `<div class="it">${mk}${esc(q.q)}<div class="sub" style="margin-top:4px">正答 ${q.a ? "○" : "×"}｜${esc(q.e)}</div></div>`
      : `<div class="it">${mk}${esc(q.q)}<div class="sub" style="margin-top:4px">${q.o.filter(o => o[1] === (q.type === "correct" ? 1 : 0)).map(o => esc(o[0])).join("")}</div></div>`; }).join("")}</div>`;
  document.getElementById("bHome").onclick = renderHome;
  const rb = document.getElementById("bRetry"); if (rb) rb.onclick = () => start(shuffle(miss), "やり直し");
  window.scrollTo(0, 0);
}

function renderPoints() {
  S = null; app.className = "wrap";
  const tbl = (head, rows) => `<div class="scroll"><table class="ptbl"><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  app.innerHTML = `<div class="top"><button id="bBack">← ホーム</button></div><h1 style="margin-top:10px">要点まとめ</h1>
  <h2>① 税目の基本</h2><div class="card">${tbl(["税目","課税主体","納税義務者","課税標準","税率","納付"], P.basic)}</div>
  <h2>② 床面積要件の比較</h2><div class="card">${tbl(["特例","床面積","主な要件"], P.area)}</div>
  <h2>③ 数字</h2><div class="card">${tbl(["項目","内容"], P.num)}</div>
  <h2>④ 印紙税の記載金額</h2><div class="card">${tbl(["文書","記載金額"], P.inshi)}</div>
  <h2>⑤ 居住用財産の譲渡の特例</h2><div class="card">${tbl(P.jo[0], P.jo.slice(1))}</div>`;
  document.getElementById("bBack").onclick = renderHome; window.scrollTo(0, 0);
}
renderHome();
})();
</script>
</body>
</html>
